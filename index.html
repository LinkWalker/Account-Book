<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="拾光账本：本地优先的个人记账本，记录收入与支出。" />
  <title>拾光账本 · 个人记账</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#main">
        <strong>拾光账本</strong>
        <small>POCKET LEDGER</small>
      </a>
      <nav class="main-nav" aria-label="页面导航">
        <a href="#entry">记一笔</a>
        <a href="#records">明细</a>
        <a href="#chart">统计</a>
      </nav>
    </div>
  </header>

  <main class="shell" id="main">
    <!-- 区块一：收支总览，数值由 stats.js 写入，本文件只做占位 -->
    <section class="overview" aria-labelledby="overview-title">
      <h2 class="sr-only" id="overview-title">收支总览</h2>
      <div class="stat-grid">
        <article class="stat-card">
          <h3 class="stat-label">总收入</h3>
          <span class="stat-value" id="stat-income">¥0.00</span>
        </article>
        <article class="stat-card">
          <h3 class="stat-label">总支出</h3>
          <span class="stat-value" id="stat-expense">¥0.00</span>
        </article>
        <article class="stat-card">
          <h3 class="stat-label">结余</h3>
          <span class="stat-value" id="stat-balance">¥0.00</span>
        </article>
      </div>
    </section>

    <div class="layout-grid">
      <div class="main-column">

        <!-- 区块二：记一笔。结构片段归 form.html（林豪），交互归 form.js（翁齐文） -->
        <section class="panel" id="entry" aria-labelledby="entry-title">
          <h2 class="panel-title" id="entry-title">记一笔</h2>

          <!-- #region form.html（负责人：林豪） -->
          <form class="entry-form" id="ledgerForm" novalidate>
            <p class="field">
              <label class="field-label" for="recordDate">日期</label>
              <input class="form-control" type="date" id="recordDate" name="date" required />
            </p>

            <p class="field">
              <label class="field-label" for="recordAmount">金额</label>
              <input class="form-control" type="number" id="recordAmount" name="amount"
                     inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" required />
            </p>

            <p class="field">
              <span class="field-label">类型</span>
              <label class="type-item"><input type="radio" name="recordType" id="recordType" value="expense" checked /><span>支出</span></label>
              <label class="type-item"><input type="radio" name="recordType" value="income" /><span>收入</span></label>
            </p>

            <p class="field">
              <label class="field-label" for="recordCategory">类别</label>
              <select class="form-control" id="recordCategory" name="category" required>
                <option value="">请选择类别</option>
                <option value="饮食">饮食</option>
                <option value="交通">交通</option>
                <option value="购物">购物</option>
                <option value="娱乐">娱乐</option>
                <option value="学习">学习</option>
                <option value="医疗">医疗</option>
                <option value="居住">居住</option>
                <option value="其他支出">其他支出</option>
                <option value="工资">工资</option>
                <option value="兼职">兼职</option>
                <option value="理财">理财</option>
                <option value="红包">红包</option>
                <option value="其他收入">其他收入</option>
              </select>
            </p>

            <p class="field">
              <label class="field-label" for="recordNote">备注</label>
              <input class="form-control" type="text" id="recordNote" name="note" maxlength="30" placeholder="选填" />
            </p>

            <p class="form-tip" id="formTip" role="status" aria-live="polite"></p>

            <p class="field field-actions">
              <button type="submit" id="submitBtn">保存</button>
            </p>
          </form>
          <!-- #endregion form.html -->
        </section>

        <!-- 区块三：明细。结构片段归 list.html（肖志渊），渲染归 list.js（马天鸿），筛选归 filter.js（魏怡健） -->
        <section class="panel" id="records" aria-labelledby="records-title">
          <div class="panel-head">
            <h2 class="panel-title" id="records-title">明细</h2>

            <p class="filter">
              <label for="filterDate">日期</label>
              <input class="form-control" type="date" id="filterDate" />
              <label for="filterMinAmount">最低金额</label>
              <input class="form-control" type="number" id="filterMinAmount" min="0" step="0.01" placeholder="不限" />
              <label for="filterMaxAmount">最高金额</label>
              <input class="form-control" type="number" id="filterMaxAmount" min="0" step="0.01" placeholder="不限" />
              <label class="sr-only" for="filterCategory">按类别筛选</label>
              <select class="form-control" id="filterCategory" name="filterCategory">
                <option value="">全部类别</option>
                <option value="饮食">饮食</option>
                <option value="交通">交通</option>
                <option value="购物">购物</option>
                <option value="娱乐">娱乐</option>
                <option value="学习">学习</option>
                <option value="医疗">医疗</option>
                <option value="居住">居住</option>
                <option value="其他支出">其他支出</option>
                <option value="工资">工资</option>
                <option value="兼职">兼职</option>
                <option value="理财">理财</option>
                <option value="红包">红包</option>
                <option value="其他收入">其他收入</option>
              </select>
            </p>
          </div>

          <div class="table-wrap">
            <table>
              <caption class="sr-only">账目明细：日期、类型、类别、金额、备注与删除操作</caption>
              <thead>
                <tr>
                  <th scope="col">日期</th>
                  <th scope="col">类型</th>
                  <th scope="col">类别</th>
                  <th scope="col" class="amount">金额</th>
                  <th scope="col">备注</th>
                  <th scope="col">删除</th>
                </tr>
              </thead>
              <tbody id="ledger-tbody">
                <!-- 数据行由 list.js 渲染，本文件不写任何数据行 -->
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <aside class="side-column">

        <!-- 区块四：支出构成饼图，绘制归 chart.js（李韩远），容器尺寸由 style.css 提供 -->
        <section class="panel" id="chart" aria-labelledby="chart-title">
          <h2 class="panel-title" id="chart-title">支出构成</h2>
          <div id="chartPie"></div>
        </section>

        <!-- 区块五：数据导出，交互归 export.js（陈嘉俊） -->
        <section class="panel" id="tools" aria-labelledby="tools-title">
          <h2 class="panel-title" id="tools-title">数据</h2>
          <div class="toolbar">
            <button type="button" id="export-btn" class="btn btn-secondary">导出 JSON</button>
            <button type="button" id="exportCsvBtn" class="btn btn-secondary">导出 CSV</button>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <p>拾光账本 · 个人记账本</p>
  </footer>

  <script src="utils.js"></script>

  <script src="storage.js"></script>

  <script src="form.js"></script>

  <script src="list.js"></script>

  <script src="stats.js"></script>

  <script src="chart.js"></script>

  <script src="export.js"></script>

  <script src="filter.js"></script>

  <script>
    document.addEventListener('ledger:change', function (e) {
      document.dispatchEvent(new CustomEvent('records:changed', { detail: e.detail }));
    });
    document.addEventListener('DOMContentLoaded', function () {
      window.LedgerFilter.init(window.getData, window.renderList);
    });
  </script>
</body>
</html>
