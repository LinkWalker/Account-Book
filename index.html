<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="拾光账本：本地优先的个人记账本，记录收入与支出。" />
  <title>拾光账本 · 个人记账</title>

  <link rel="stylesheet" href="style.css" />
  <!-- TODO: 等待 style.css（负责人：薛昌建） -->

  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="#main">
        <strong>拾光账本</strong>
        <small>POCKET LEDGER</small>
      </a>
      <nav class="main-nav" aria-label="页面导航">
        <a href="#entry">记一笔</a>
        <a href="#records">明细</a>
        <a href="#chart">统计</a>
      </nav>
    </div>
  </header>

  <main class="shell" id="main">
    <!-- 区块一：收支总览，数值由 stats.js 写入，本文件只做占位 -->
    <section class="overview" aria-labelledby="overview-title">
      <h2 class="sr-only" id="overview-title">收支总览</h2>
      <div class="stat-grid">
        <article class="stat-card">
          <h3 class="stat-label">总收入</h3>
          <p class="stat-value" id="total-income">¥0.00</p>
        </article>
        <article class="stat-card">
          <h3 class="stat-label">总支出</h3>
          <p class="stat-value" id="total-expense">¥0.00</p>
        </article>
        <article class="stat-card">
          <h3 class="stat-label">结余</h3>
          <p class="stat-value" id="balance">¥0.00</p>
        </article>
      </div>
    </section>

    <div class="layout-grid">
      <div class="main-column">

        <!-- 区块二：记一笔。结构片段归 form.html（林豪），交互归 form.js（翁齐文） -->
        <section class="panel" id="entry" aria-labelledby="entry-title">
          <h2 class="panel-title" id="entry-title">记一笔</h2>

          <!-- #region form.html（负责人：林豪） -->
          <form class="entry-form" id="entry-form">
            <p class="field">
              <label class="field-label" for="date-input">日期</label>
              <input type="date" id="date-input" name="date" />
            </p>

            <p class="field">
              <label class="field-label" for="amount-input">金额</label>
              <input type="number" id="amount-input" name="amount"
                     inputmode="decimal" min="0.01" step="0.01" placeholder="0.00" />
            </p>

            <p class="field">
              <label class="field-label" for="type-select">类型</label>
              <select id="type-select" name="type">
                <option value="expense">支出</option>
                <option value="income">收入</option>
              </select>
            </p>

            <p class="field">
              <label class="field-label" for="category">类别</label>
              <select id="category" name="category">
                <option value="">请选择类别</option>
              </select>
            </p>

            <p class="field">
              <label class="field-label" for="note">备注</label>
              <input type="text" id="note" name="note" maxlength="60" placeholder="选填" />
            </p>

            <p class="field field-actions">
              <button type="submit" id="submit-btn">保存</button>
            </p>
          </form>
          <!-- #endregion form.html -->
        </section>

        <!-- 区块三：明细。结构片段归 list.html（肖志渊），渲染归 list.js（马天鸿），筛选归 filter.js（魏怡健） -->
        <section class="panel" id="records" aria-labelledby="records-title">
          <div class="panel-head">
            <h2 class="panel-title" id="records-title">明细</h2>

            <p class="filter">
              <label class="sr-only" for="filter-category">按类别筛选</label>
              <select id="filter-category">
                <option value="all">全部类别</option>
              </select>
            </p>
          </div>

          <div class="table-wrap">
            <table id="record-table">
              <caption class="sr-only">账目明细：日期、类型、类别、金额、备注与删除操作</caption>
              <thead>
                <tr>
                  <th scope="col">日期</th>
                  <th scope="col">类型</th>
                  <th scope="col">类别</th>
                  <th scope="col">金额</th>
                  <th scope="col">备注</th>
                  <th scope="col">删除</th>
                </tr>
              </thead>
              <tbody id="record-table-body">
                <!-- 数据行由 list.js 渲染，本文件不写任何数据行 -->
              </tbody>
            </table>
          </div>
        </section>
      </div>

      <aside class="side-column">

        <!-- 区块四：支出构成饼图，绘制归 chart.js（李韩远），容器尺寸由 style.css 提供 -->
        <section class="panel" id="chart" aria-labelledby="chart-title">
          <h2 class="panel-title" id="chart-title">支出构成</h2>
          <div id="pie-chart"></div>
        </section>

        <!-- 区块五：数据导出，交互归 export.js（陈嘉俊） -->
        <section class="panel" id="tools" aria-labelledby="tools-title">
          <h2 class="panel-title" id="tools-title">数据</h2>
          <button type="button" id="export-btn">导出 CSV</button>
        </section>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <p>拾光账本 · 个人记账本</p>
  </footer>

  <script src="utils.js"></script>

  <script src="storage.js"></script>
  <!-- TODO: 等待 storage.js（负责人：梁洪睿） -->

  <script src="form.js"></script>
  <!-- TODO: 等待 form.js（负责人：翁齐文） -->

  <script src="list.js"></script>
  <!-- TODO: 等待 list.js（负责人：马天鸿） -->

  <script src="stats.js"></script>
  <!-- TODO: 等待 stats.js（负责人：林晓捷） -->

  <script src="chart.js"></script>
  <!-- TODO: 等待 chart.js（负责人：李韩远） -->

  <script src="export.js"></script>
  <!-- TODO: 等待 export.js（负责人：陈嘉俊） -->

  <script src="filter.js"></script>
  <!-- TODO: 等待 filter.js（负责人：魏怡健） -->

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      initForm();
      renderList();
      renderStats();
      renderChart();
    });
  </script>
</body>
</html>
